<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raven · Pattern puzzles</title>
    <meta name="description" content="Endless pattern puzzles in the style of Raven's Progressive Matrices. Take a timed 35-puzzle test or practice at your own pace." />
    <meta name="theme-color" content="#252a3a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme before the first paint, so it never flashes: the saved choice, else the system's.
      let theme;
      try {
        theme = JSON.parse(localStorage.getItem('raven')).theme;
      } catch {
        // Nothing saved, or storage is blocked.
      }
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
    </script>
    <style>
      /* Installed-app launch: the first paint copies Chrome's launch screen (manifest background,
         maskable icon at 128px), then launchExit() animates out of it. There is no copy of the name:
         Chrome places it against the whole screen, bars included, so it fades out in place. */
      #launch {
        display: none;
      }
      .launching #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #252a3a;
      }
      #launch-icon {
        position: relative;
        width: 128px;
        height: 128px;
      }
      /* One layer per piece of the icon's puzzle, so each can fly to its own cell. */
      #launch-icon svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
    </style>
    <script>
      // Plays once per fresh launch of the installed app at its start page (Home, under the copy): never in a
      // browser tab, on reload, on return, or for a link that opens the app on a puzzle.
      (() => {
        const root = document.documentElement;
        try {
          const nav = performance.getEntriesByType('navigation')[0];
          const app = matchMedia('(display-mode: standalone)').matches;
          if (!app || location.hash || nav?.type !== 'navigate' || sessionStorage.getItem('launched')) return;
          sessionStorage.setItem('launched', '1');
        } catch {
          return;
        }
        root.classList.add('launching');
        // Drops the listeners the exit adds.
        const exit = new AbortController();
        const end = () => {
          clearTimeout(fallback);
          exit.abort();
          root.classList.remove('launching');
          document.getElementById('launch')?.remove();
          // The fallback can run before the page below has been parsed.
          const app = document.getElementById('app');
          if (app) app.inert = false;
        };
        // The game never stays hidden behind the copy if it fails to call launchExit.
        const fallback = setTimeout(end, 4000);
        // play(overlay) starts the game's exit and returns its Web Animations.
        window.launchExit = (play) => {
          clearTimeout(fallback);
          const overlay = document.getElementById('launch');
          // Too late: the fallback already ended the launch.
          if (!overlay || !root.classList.contains('launching')) return;
          // Whatever fails here only skips the motion: the copy never stays up, and the caller carries on.
          try {
            // Nothing behind the copy takes keys until it has gone.
            document.getElementById('app').inert = true;
            const width = innerWidth;
            const height = innerHeight;
            let animations = [];
            if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
              try {
                animations = play(overlay);
              } catch {
                animations = [];
              }
            }
            if (!animations.length) {
              animations = [overlay.animate({ opacity: [1, 0] }, { duration: 200, easing: 'ease-out', fill: 'forwards' })];
            }
            // A tap skips to the end, and so does a rotation, which moves what the pieces fly to. The installed
            // app gets a resize event as it starts with the size unchanged; that one must not cut the motion.
            const skip = () => animations.forEach((a) => a.finish());
            const eat = (event) => {
              event.preventDefault();
              event.stopImmediatePropagation();
            };
            // While the copy shows, a tap or key only skips it: nothing behind it reacts.
            const swallow = (event) => {
              eat(event);
              // A touch's click comes after the copy has gone, aimed at whatever is under the finger, so the
              // guard outlives the launch. It takes only that pointer's click: a keyboard click (pointerId -1) and
              // other fingers go through. A drag or a mouse press that loses its click leaves no click to eat, so
              // the pointer's next press or cancel, or a second, drops the guard before it can take a real click.
              if (event.type === 'pointerdown' && event.isPrimary && event.button === 0) {
                const guard = new AbortController();
                const drop = () => guard.abort();
                const pointer = event.pointerId;
                const mine = (other) => other.pointerId === pointer;
                const eatPress = (click) => {
                  // Browsers whose clicks carry no pointer id: a click from a press counts it in detail.
                  if (click.pointerId === undefined ? !click.detail : !mine(click)) return;
                  eat(click);
                  drop();
                };
                const dropMine = (other) => mine(other) && drop();
                addEventListener('click', eatPress, { capture: true, signal: guard.signal });
                addEventListener('pointercancel', dropMine, { capture: true, signal: guard.signal });
                addEventListener('pointerdown', dropMine, { capture: true, signal: guard.signal });
                setTimeout(drop, 1000);
              }
              skip();
            };
            addEventListener('pointerdown', swallow, { capture: true, signal: exit.signal });
            addEventListener('keydown', swallow, { capture: true, signal: exit.signal });
            addEventListener(
              'resize',
              () => {
                if (innerWidth !== width || innerHeight !== height) skip();
              },
              { signal: exit.signal },
            );
            Promise.all(animations.map((a) => a.finished)).then(end, end);
          } catch {
            end();
          }
        };
      })();
    </script>
  </head>

  <body>
    <div id="launch" aria-hidden="true">
      <div id="launch-icon">
        <svg viewBox="0 0 512 512"><g transform="matrix(0.8 0 0 0.8 51.2 51.2)"><circle cx="160" cy="160" r="66" fill="#e8ebf4" /></g></svg>
        <svg viewBox="0 0 512 512"><g transform="matrix(0.8 0 0 0.8 51.2 51.2)"><path d="M352 99L418 213H286Z" fill="#8890a8" stroke="#8890a8" stroke-width="12" stroke-linejoin="round" /></g></svg>
        <svg viewBox="0 0 512 512"><g transform="matrix(0.8 0 0 0.8 51.2 51.2)"><path d="M160 291L226 405H94Z" fill="#8890a8" stroke="#8890a8" stroke-width="12" stroke-linejoin="round" /></g></svg>
        <svg viewBox="0 0 512 512"><g transform="matrix(0.8 0 0 0.8 51.2 51.2)"><path d="M312 330C312 288 392 288 392 336C392 366 352 366 352 394" fill="none" stroke="#8aa8ff" stroke-width="30" stroke-linecap="round" /><circle cx="352" cy="432" r="18" fill="#8aa8ff" /></g></svg>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
